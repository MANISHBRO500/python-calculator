<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Calculator Output</title>
  <style>
    :root {
      --bg: #d9d9d9;
      --shell-bg: #f5f5f5;
      --shell-window: #eaeaea;
      --panel: #ffffff;
      --console-bg: #1e1e1e;
      --console-text: #f5f5f5;
      --console-muted: #9aa0a6;
      --console-green: #7fe38a;
      --console-blue: #7ab8ff;
      --console-red: #ff8a8a;
      --console-yellow: #f3d18b;
      --border: #bfbfbf;
      --header: #d4d4d4;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #d8d8d8 0%, #cfcfcf 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1f1f1f;
    }

    .shell {
      width: min(960px, 100%);
      background: var(--shell-window);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border-top: 5px solid #d9d9d9;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--header);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      color: #2e2e2e;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green { background: #28c840; }

    .title-text {
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 12px;
      opacity: 0.8;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 18px;
      padding: 18px;
      background: var(--shell-bg);
    }

    .panel {
      background: #f7f7f7;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 15px;
      color: #2e2e2e;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      color: #4d4d4d;
      font-weight: 700;
    }

    input, select, button {
      width: 100%;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      background: #fff;
      color: #1d1d1d;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #7aa8ff;
      box-shadow: 0 0 0 3px rgba(122,168,255,0.18);
    }

    button {
      background: linear-gradient(180deg, #f9f9f9, #e9e9e9);
      cursor: pointer;
      font-weight: 700;
      border-color: #bdbdbd;
    }

    button:hover {
      background: linear-gradient(180deg, #f4f4f4, #e2e2e2);
    }

    .console {
      background: var(--console-bg);
      border-radius: 10px;
      border: 1px solid #2f2f2f;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #232323;
      border-bottom: 1px solid #2b2b2b;
      padding: 10px 12px;
      color: var(--console-muted);
      font-size: 12px;
      font-family: "Segoe UI", sans-serif;
    }

    .console-title {
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .console-body {
      min-height: 300px;
      padding: 18px 16px 14px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.7;
      color: var(--console-text);
      background: linear-gradient(180deg, #1f1f1f, #1a1a1a);
    }

    .prompt {
      color: var(--console-green);
      margin-right: 8px;
      font-weight: bold;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line.success {
      color: var(--console-green);
    }

    .line.error {
      color: var(--console-red);
    }

    .line.info {
      color: var(--console-blue);
    }

    @media (max-width: 760px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="titlebar">
      <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="title-text">Python Calculator</div>
      <div style="width: 72px;"></div>
    </div>

    <div class="content">
      <div class="panel">
        <h2>Input</h2>

        <div class="field">
          <label for="num1">First Number</label>
          <input id="num1" type="number" value="10" />
        </div>

        <div class="field">
          <label for="operator">Operator</label>
          <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
          </select>
        </div>

        <div class="field">
          <label for="num2">Second Number</label>
          <input id="num2" type="number" value="5" />
        </div>

        <button onclick="calculate()">Run Calculator</button>
      </div>

      <div class="console" aria-live="polite">
        <div class="console-header">
          <span class="console-title">IDLE Console</span>
          <span>Python 3.x</span>
        </div>
        <div class="console-body" id="consoleBody">
          <div class="line info"><span class="prompt">&gt;&gt;&gt;</span> Enter first number: 10</div>
          <div class="line info"><span class="prompt">&gt;&gt;&gt;</span> Enter an operator (+, -, *, /, %): +</div>
          <div class="line info"><span class="prompt">&gt;&gt;&gt;</span> Enter second number: 5</div>
          <div class="line success"><span class="prompt">&gt;&gt;&gt;</span> Result: 15</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const num1 = Number(document.getElementById('num1').value);
      const num2 = Number(document.getElementById('num2').value);
      const operator = document.getElementById('operator').value;
      const consoleBody = document.getElementById('consoleBody');

      let lines = [];
      lines.push({ text: `Enter first number: ${num1}`, type: 'info' });
      lines.push({ text: `Enter an operator (+, -, *, /, %): ${operator}`, type: 'info' });
      lines.push({ text: `Enter second number: ${num2}`, type: 'info' });

      if (!Number.isFinite(num1) || !Number.isFinite(num2)) {
        lines.push({ text: 'Error! Invalid input. Please enter valid numbers.', type: 'error' });
      } else if (operator === '+') {
        lines.push({ text: `Result: ${num1 + num2}`, type: 'success' });
      } else if (operator === '-') {
        lines.push({ text: `Result: ${num1 - num2}`, type: 'success' });
      } else if (operator === '*') {
        lines.push({ text: `Result: ${num1 * num2}`, type: 'success' });
      } else if (operator === '/') {
        if (num2 === 0) {
          lines.push({ text: 'Error! Division by zero is not allowed.', type: 'error' });
        } else {
          lines.push({ text: `Result: ${num1 / num2}`, type: 'success' });
        }
      } else if (operator === '%') {
        if (num2 === 0) {
          lines.push({ text: 'Error! Modulo by zero is not allowed.', type: 'error' });
        } else {
          lines.push({ text: `Remainder: ${num1 % num2}`, type: 'success' });
        }
      } else {
        lines.push({ text: 'Error! Invalid operator entered.', type: 'error' });
      }

      consoleBody.innerHTML = lines.map(line => {
        return `<div class="line ${line.type}"><span class="prompt">&gt;&gt;&gt;</span> ${line.text}</div>`;
      }).join('');
    }
  </script>
</body>
</html>
