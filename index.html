<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Calculator Output</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --primary: #38bdf8;
      --secondary: #22c55e;
      --danger: #ef4444;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.25);
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #020817, #0f172a 35%, #111827);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(820px, 100%);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, rgba(56,189,248,0.22), rgba(34,197,94,0.12));
      padding: 22px 26px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      padding: 26px;
    }

    .panel {
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--muted);
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: 0.2s ease;
    }

    input, select {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }

    input:focus, select:focus {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    button {
      background: linear-gradient(135deg, var(--primary), #0ea5e9);
      color: #03111f;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .output-box {
      min-height: 260px;
      background: #020817;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      font-family: "Courier New", Courier, monospace;
      color: #d1fae5;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .output-box .title {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 12px;
      display: block;
    }

    .result-line {
      color: #bbf7d0;
      font-size: 1.05rem;
      margin: 8px 0;
    }

    .error-line {
      color: #fca5a5;
      margin: 8px 0;
    }

    .small-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Python Calculator</h1>
      <p>Styled output view for arithmetic operations</p>
    </div>

    <div class="content">
      <div class="panel">
        <h2>Calculator Input</h2>

        <div class="field">
          <label for="num1">First Number</label>
          <input id="num1" type="number" value="10" />
        </div>

        <div class="field">
          <label for="operator">Operator</label>
          <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
          </select>
        </div>

        <div class="field">
          <label for="num2">Second Number</label>
          <input id="num2" type="number" value="5" />
        </div>

        <button onclick="calculate()">Calculate</button>
      </div>

      <div class="panel">
        <h2>Python Output</h2>
        <div class="output-box" id="outputBox">
          <span class="title">Console Output</span>
          <div class="result-line">Enter first number: 10</div>
          <div class="result-line">Enter an operator (+, -, *, /, %): +</div>
          <div class="result-line">Enter second number: 5</div>
          <div class="result-line">Result: 15</div>
        </div>
        <div class="small-note">This page mimics the output style of a Python calculator.</div>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const num1 = Number(document.getElementById('num1').value);
      const num2 = Number(document.getElementById('num2').value);
      const operator = document.getElementById('operator').value;
      const output = document.getElementById('outputBox');

      let lines = [];
      lines.push(`Enter first number: ${num1}`);
      lines.push(`Enter an operator (+, -, *, /, %): ${operator}`);
      lines.push(`Enter second number: ${num2}`);

      if (!Number.isFinite(num1) || !Number.isFinite(num2)) {
        lines.push('Error! Invalid input. Please enter valid numbers.');
      } else if (operator === '+') {
        lines.push(`Result: ${num1 + num2}`);
      } else if (operator === '-') {
        lines.push(`Result: ${num1 - num2}`);
      } else if (operator === '*') {
        lines.push(`Result: ${num1 * num2}`);
      } else if (operator === '/') {
        if (num2 === 0) {
          lines.push('Error! Division by zero is not allowed.');
        } else {
          lines.push(`Result: ${num1 / num2}`);
        }
      } else if (operator === '%') {
        if (num2 === 0) {
          lines.push('Error! Modulo by zero is not allowed.');
        } else {
          lines.push(`Remainder: ${num1 % num2}`);
        }
      } else {
        lines.push('Error! Invalid operator entered.');
      }

      output.innerHTML = '<span class="title">Console Output</span>' +
        lines.map(line => {
          const cls = line.includes('Error!') ? 'error-line' : 'result-line';
          return `<div class="${cls}">${line}</div>`;
        }).join('');
    }
  </script>
</body>
</html>
